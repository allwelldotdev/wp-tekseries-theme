<!doctype html>
<html>
<head><meta charset="utf-8"><title>SocialButton — preview</title></head>
<body style="margin:0;background:#4A1D5E">
<div id="root"></div>
<script>
  var T = window.TekSeries, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', gap: '10px', padding: '28px' } },
      h(T.SocialButton, { mark: 'in', label: 'LinkedIn', href: 'https://www.linkedin.com/company/tekseries/' }),
      h(T.SocialButton, { mark: 'fb', label: 'Facebook', href: 'https://www.facebook.com/share/18AH7UBXue/' }),
      h(T.SocialButton, { mark: 'ig', label: 'Instagram', href: 'https://instagram.com/tekseries' })));
</script>
</body>
</html>
