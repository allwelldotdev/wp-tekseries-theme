<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconTile — preview</title></head>
<body style="margin:0;background:#FFFFFF">
<div id="root"></div>
<script>
  var T = window.TekSeries, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', gap: '16px', padding: '24px', alignItems: 'center' } },
      h(T.IconTile, { name: 'co_present' }),
      h(T.IconTile, { name: 'potted_plant' }),
      h(T.IconTile, { name: 'emoji_events' }),
      h(T.IconTile, { name: 'work' })));
</script>
</body>
</html>
